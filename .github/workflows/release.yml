# 推送版本 tag 时构建扩展包。
# - vX.Y.Z（正式版）：构建并创建 GitHub Release，附 Chrome / Edge zip 与自上个正式版以来的提交列表。
# - vX.Y.Z-alpha.N 等预发布 tag：创建标记为 Pre-release 的 GitHub Release，附 zip 与自上一个 tag 以来的提交列表。
# tag 必须与 package.json 的 version 一致（不含前缀 v）。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # 优先用 Celesto 自托管 runner；额度用完时把仓库变量 CI_RUNNER 设为 github 改回 GitHub 托管
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","celesto-micro"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "tag $GITHUB_REF_NAME 与 package.json 版本 $PKG 不一致"; exit 1; fi
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "STABLE=1" >> "$GITHUB_ENV"; else echo "STABLE=0" >> "$GITHUB_ENV"; fi

      - name: 确保有 gh（自托管 runner 镜像可能没装）
        run: |
          if ! command -v gh >/dev/null; then
            V=2.62.0
            curl -fsSL "https://github.com/cli/cli/releases/download/v$V/gh_${V}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_${V}_linux_amd64/bin" >> "$GITHUB_PATH"
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test

      - run: pnpm zip
      - run: pnpm zip:edge

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$STABLE" = "1" ]; then
            PREV="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$GITHUB_REF_NAME" | head -n1 || true)"
            FLAG=""
          else
            PREV="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
            FLAG="--prerelease"
          fi
          RANGE="${PREV:+$PREV..}$GITHUB_REF_NAME"
          { echo "## 更新内容"; echo; git log --no-merges --pretty='- %s' "$RANGE"; } > notes.md
          gh release create "$GITHUB_REF_NAME" .output/*.zip --title "Navill $GITHUB_REF_NAME" --notes-file notes.md $FLAG

      # 正式版自动提交到 Edge Add-ons（预发布不提交）。需要仓库 Secrets：EDGE_CLIENT_ID、EDGE_API_KEY、EDGE_PRODUCT_ID；没配就跳过。
      # 商店包不带开发 key（WXT_EXTENSION_KEY=none），商店会用自己分配的扩展 ID。
      - name: 提交 Edge Add-ons
        if: env.STABLE == '1'
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          if [ -z "$EDGE_CLIENT_ID" ] || [ -z "$EDGE_API_KEY" ] || [ -z "$EDGE_PRODUCT_ID" ]; then
            echo "::notice::未配置 Edge Secrets，跳过商店提交"; exit 0
          fi
          # Release 已上传带 key 的包，这里重新打一个不带 key 的覆盖同名文件
          WXT_EXTENSION_KEY=none pnpm zip:edge
          ZIP=".output/navill-${GITHUB_REF_NAME#v}-edge.zip"
          node -e 'if(require("./.output/edge-mv3/manifest.json").key){console.error("商店包不应包含 key");process.exit(1)}'
          scripts/edge-publish.sh "$ZIP" "Navill $GITHUB_REF_NAME 更新。测试步骤同首次提交：安装后新标签页即为 Navill，可从浏览器书签导入。"
