name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # 优先用 Celesto 自托管 runner；额度用完时把仓库变量 CI_RUNNER 设为 github 改回 GitHub 托管
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","celesto-micro"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm zip
      - run: pnpm zip:edge
      - uses: actions/upload-artifact@v4
        with:
          name: navill-extension
          path: .output/*.zip
