# 把仓库里的 wiki/ 目录同步到 GitHub Wiki（<repo>.wiki.git）。wiki/ 是唯一来源：
# 英文页在根目录（默认，Home 为英文首页），中文页在 wiki/zh/（含自己的 _Sidebar）。
# 截图直接引用仓库 assets/store/ 的 raw 地址，不复制进 Wiki。
# ⚠️ 不要在网页上改 Wiki：下次同步会被覆盖。
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","celesto-micro"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: 推送到 Wiki 仓库
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          find "$RUNNER_TEMP/wiki" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R wiki/. "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki 无变化"; exit 0; fi
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push origin HEAD
