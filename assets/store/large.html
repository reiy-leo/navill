<html><head><style>
*{margin:0;box-sizing:border-box}
body{width:1400px;height:560px;overflow:hidden;font-family:'Noto Sans CJK SC','Noto Sans SC',sans-serif;
background:radial-gradient(900px 600px at 15% 20%,#FFF4DF 0%,transparent 60%),linear-gradient(135deg,#FBE6C2 0%,#F2D3A3 100%);position:relative}
.left{position:absolute;left:84px;top:0;height:560px;width:520px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:34px}
.brand img{width:84px;height:84px;filter:drop-shadow(0 8px 18px rgba(150,95,30,.25))}
.brand span{font-size:44px;font-weight:700;color:#5A3A12;letter-spacing:.5px;font-family:'Noto Sans',sans-serif}
h1{font-size:50px;line-height:1.25;font-weight:800;color:#3E2708;letter-spacing:1px}
h1 em{font-style:normal;color:#C7862E}
p{margin-top:22px;font-size:22px;color:#7A5A30;letter-spacing:2px}
.win{position:absolute;left:620px;top:64px;width:860px;height:560px;border-radius:18px;overflow:hidden;background:#fff;
box-shadow:0 30px 70px rgba(120,70,20,.28),0 0 0 1px rgba(120,70,20,.08)}
.bar{position:relative;z-index:1;height:34px;background:#F7EFE4;display:flex;align-items:center;gap:8px;padding-left:16px}
.bar i{width:12px;height:12px;border-radius:50%;background:#E8C9A0;display:block}
.win img{width:820px;display:block;margin-top:-14px}
</style></head><body>
<div class="left">
  <div class="brand"><img src="../brand/icon-source.png"><span>Navill</span></div>
  <h1>把书签整理成<br><em>工作区</em>和<em>抽屉</em></h1>
  <p>场景 · 分身 · 同步 · 分享</p>
</div>
<div class="win"><div class="bar"><i></i><i></i><i></i></div><img src="ui.png"></div>
</body></html>
